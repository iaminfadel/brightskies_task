localization_core:
  ros__parameters:
    use_sim_time: true

    frames:
      map: map
      base_link: base_link
      lidar: hero/lidar
      gnss: hero/gnss
      imu: hero/imu

    map:
      # ADR 0003 (#34): the cloud is consumed by subscription on
      # /localization/map_cloud, not loaded in process. Only the georeference
      # is configured here -- it must be kept in step with the bundle the
      # map_server serves (map.yaml anchor, source first_gnss_fix). Deploying
      # a different bundle means overriding these (LOCALIZATION_PARAMS) and
      # MAP_DIR together.
      id: town05-v14-pg
      anchor_lat_deg: 0.0008546875172470436
      anchor_lon_deg: -0.0014887973462199867
      anchor_alt_m: 2.033297300338745
      # Fatal exit if the map_server delivers no cloud in this window.
      cloud_timeout_s: 30.0
      voxel_size_m: 0.25

    pipeline:
      scan_stride: 2          # GICP at 5 Hz from the 10 Hz LiDAR
      stale_scan_s: 0.3

    lidar:
      min_range_m: 0.0
      max_range_m: 50.0

    initialization:
      attempt_period_s: 0.5
      fail_after_s: 5.0
      yaw_span_deg: 45.0
      yaw_steps: 7
      gnss_baseline_m: 1.0

    relocalization:
      period_s: 1.0
      yaw_span_deg: 30.0
      yaw_steps: 7

    gnss:
      fresh_s: 1.0
      sigma_xy_m: 1.5
      sigma_z_m: 3.0
      innovation_window: 50

    innovation:
      gate_chi2: 18.47        # 4 dof, 99.9 %
      sigma_xy_m: 1.0
      sigma_z_m: 2.0
      sigma_yaw_deg: 10.0

    covariance:
      degraded_scale: 10.0
      degraded_trace_gate: 1.5

    gicp:
      max_iterations: 30
      convergence_eps: 0.0001
      convergence_rotation_deg: 0.0057
      fine_motion_gate_m: 0.02
      fine_rotation_gate_deg: 0.5
      num_threads: 2
      num_neighbors: 10
      crop_radius_m: 80.0
      max_correspondence_init_m: 1.0
      max_correspondence_final_m: 0.5
      rmse_gate_m: 0.20
      inlier_gate: 0.60
      condition_gate: 1000000.0

    health:
      degraded_after_bad_s: 0.6
      failed_after_bad_s: 2.0
      gnss_timeout_s: 1.0
      sources_stale_s: 2.0
      recover_after_good_s: 2.0
      scan_stale_s: 0.6

    topics:
      lidar: /carla/hero/lidar
      gnss: /carla/hero/gnss
      imu: /localization/imu
      filtered: /odometry/filtered
      map_cloud: /localization/map_cloud
