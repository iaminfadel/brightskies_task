kiss_icp_node:
  ros__parameters:
    use_sim_time: true
    pointcloud_topic: /carla/hero/lidar
    base_frame: base_link
    lidar_odom_frame: odom
    publish_odom_tf: true
    invert_odom_tf: false
    publish_debug_clouds: false
    position_covariance: 0.05
    orientation_covariance: 0.01

    data:
      deskew: false
      max_range: 50.0
      min_range: 0.0
    mapping:
      voxel_size: 0.5
      max_points_per_voxel: 20
    adaptive_threshold:
      initial_threshold: 2.0
      min_motion_th: 0.1
    registration:
      max_num_iterations: 100
      convergence_criterion: 0.0001
      max_num_threads: 0
