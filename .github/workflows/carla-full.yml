name: carla-full

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: carla-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/330586358676/locations/global/workloadIdentityPools/github/providers/github-oidc-v2
          service_account: brightskies-ci@project-e038f785-ff95-4654-ba6.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run full matrix on VM
        env:
          BUCKET: brightskies-artifacts-330586358676
        run: |
          python3 infra/vm_job.py run \
            --command "bash scripts/validation/run_on_vm.sh" \
            --artifact-dir artifacts/full \
            --collect /ws/evidence \
            --max-retries 1
