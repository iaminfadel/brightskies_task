name: carla-smoke

# Gate tier 3 (docs/ci.md): the integration gate on the staging branch.
# Runs the merged staging state on the GCP VM through vm_job.py (start VM,
# deploy committed staging HEAD, run the smoke, collect /ws/evidence, stop
# VM). Currently ADVISORY until proven green repeatedly + forced-fail
# (ratchet rule); it is not a required check yet.
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: carla-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/330586358676/locations/global/workloadIdentityPools/github/providers/github-oidc-v2
          service_account: brightskies-ci@project-e038f785-ff95-4654-ba6.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run smoke on VM
        env:
          BUCKET: brightskies-artifacts-330586358676
        run: |
          python3 scripts/vm_job.py run \
            --command "bash scripts/validation/run_on_vm.sh" \
            --artifact-dir artifacts/smoke \
            --collect /ws/evidence
