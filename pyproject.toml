# Pinned tool config for the repo (ruff is run by pre-commit and by the
# ci/lint job; keep this file the single source so local and CI agree).
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Errors + pyflakes only: near-zero churn on the existing scripts tree.
# Broaden deliberately (see docs/ci.md ratchet), not wholesale.
select = ["E4", "E7", "E9", "F"]
